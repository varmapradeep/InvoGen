<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <button class="btn-back" (click)="goBack()">← Back</button>
      <h2>Create New Account</h2>
    </div>
  </div>

  <div class="creation-grid">
    <!-- User Core Info -->
    <div class="card account-card">
      <div class="card-header">
        <h3>Login & Identity</h3>
      </div>
      <form class="admin-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="newUser.name" name="name" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="newUser.email" name="email" placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newUser.password" name="password" placeholder="••••••••">
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [title]="showPassword ? 'Hide Password' : 'Show Password'">
              <svg style="width:18px;height:18px">
                <use [attr.href]="showPassword ? icons.eyeOff : icons.eye"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>System Role</label>
          <select [(ngModel)]="newUser.role" name="role">
            <option value="USER">Standard User</option>
            <option value="ADMIN">Administrator</option>
          </select>
        </div>
      </form>
    </div>

    <!-- User Branding Info -->
    <div class="card branding-card">
      <div class="card-header">
        <h3>Invoice Branding</h3>
      </div>
      <div class="admin-form">
        <div class="form-group">
          <label>Company/Business Name</label>
          <input type="text" [(ngModel)]="newUser.companyName" name="companyName" placeholder="Acme Global">
        </div>
        <div class="form-group">
          <label>Business Address</label>
          <textarea rows="3" [(ngModel)]="newUser.companyAddress" name="companyAddress" placeholder="123 Street, City, Country"></textarea>
        </div>
        
        <div class="form-group">
          <label>Invoice Logo</label>
          <div class="logo-uploader">
            <div class="logo-preview" *ngIf="newUser.companyLogoUrl">
              <img [src]="newUser.companyLogoUrl" alt="Logo">
            </div>
            <div class="uploader-controls">
              <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display:none">
              <button class="btn-upload" (click)="fileInput.click()" [disabled]="uploading">
                {{ uploading ? 'Uploading...' : 'Choose Logo' }}
              </button>
              <p class="hint">Recommended: Transparent PNG, 300x100px.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="final-actions">
    <button class="btn-cancel" (click)="goBack()">Cancel</button>
    <button class="btn-save" (click)="createUser()" [disabled]="loading || uploading">
      {{ loading ? 'Creating Account...' : 'Confirm & Create User' }}
    </button>
  </div>
</div>
